<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>羊羊打猎站</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#FFF3EC,#FFE4DA 60%,#FFF7F2);
  display:flex;align-items:center;justify-content:center;color:#3A2E2A}
.box{text-align:center;padding:24px}
.sheep{font-size:54px;animation:b 1.1s ease-in-out infinite}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{margin:14px 0 6px;font-size:23px;color:#B84B34;letter-spacing:.5px}
.tip{font-size:14px;color:#A98276;line-height:1.8}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#F4633F;margin:0 3px;
  animation:f 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes f{0%,100%{opacity:.25}50%{opacity:1}}
.err{margin-top:18px;font-size:13px;color:#C2533A;display:none}
.err a{color:#F4633F}
</style></head><body>
<div class="box">
  <div class="sheep">🐑</div>
  <h1>羊羊打猎站</h1>
  <div class="tip">正在带你去找今天的猎物<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="err" id="err">
    链接正在更新，稍等几秒再刷新一次。<br>
    <a id="retry" href="javascript:location.reload()">点这里重试</a>
  </div>
</div>
<script>
(async function () {
  const err = document.getElementById('err');
  try {
    // 强制不走缓存，保证拿到最新隧道地址
    const r = await fetch('./tunnel.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('json ' + r.status);
    const j = await r.json();
    if (!j || !j.url) throw new Error('no url');
    // 带上她原来的路径（比如 /admin）
    const tail = (location.pathname.replace(/^\/go\/?/, '') + location.search + location.hash);
    location.replace(j.url.replace(/\/$/, '') + '/' + tail.replace(/^\//, ''));
  } catch (e) {
    err.style.display = 'block';
    setTimeout(() => location.reload(), 6000);
  }
})();
</script></body></html>

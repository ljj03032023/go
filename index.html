<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>羊羊打猎站</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#FFF3EC,#FFE4DA 60%,#FFF7F2);
  display:flex;align-items:center;justify-content:center;color:#3A2E2A}
.box{text-align:center;padding:24px}
.sheep{font-size:54px;animation:b 1.1s ease-in-out infinite}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{margin:14px 0 6px;font-size:23px;color:#B84B34;letter-spacing:.5px}
.tip{font-size:14px;color:#A98276;line-height:1.8}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#F4633F;margin:0 3px;animation:f 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes f{0%,100%{opacity:.25}50%{opacity:1}}
.err{margin-top:18px;font-size:13px;color:#C2533A;display:none}
</style></head><body>
<div class="box">
  <div class="sheep">🐑</div>
  <h1>羊羊打猎站</h1>
  <div class="tip">正在带你去找今天的猎物<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="err" id="err">链接正在更新，稍等几秒会自动重试。</div>
</div>
<script>
const REPO = 'ljj03032023/go';
const RAW = 'https://api.github.com/repos/' + REPO + '/contents/tunnel.json';

function b64ToText(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

async function getUrl() {
  // 1) 首选 GitHub API：不做 CDN 缓存，永远是最新的
  try {
    const r = await fetch(RAW + '?t=' + Date.now(), {
      cache: 'no-store',
      headers: { Accept: 'application/vnd.github+json' },
    });
    if (r.ok) {
      const j = await r.json();
      const data = JSON.parse(b64ToText(j.content));
      if (data && data.url) return data.url;
    }
  } catch (e) { /* 继续走备用 */ }

  // 2) 备用：同目录静态文件
  const r2 = await fetch('./tunnel.json?t=' + Date.now(), { cache: 'no-store' });
  const j2 = await r2.json();
  return j2.url;
}

(async function () {
  const err = document.getElementById('err');
  try {
    const target = await getUrl();
    if (!target) throw new Error('no url');
    // 支持两种写法：
    //   /go/                 → 打开点单页
    //   /go/#admin?pin=8888  → 打开后台
    const hash = location.hash.replace(/^#\/?/, '');
    const p = location.pathname.replace(/^\/go\/?/, '');
    const tail = (hash || (p + location.search)).replace(/^\//, '');
    location.replace(target.replace(/\/$/, '') + '/' + tail);
  } catch (e) {
    err.style.display = 'block';
    setTimeout(() => location.reload(), 5000);
  }
})();
</script></body></html>
